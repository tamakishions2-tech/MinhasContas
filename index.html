function vBancos(){return S.apps.filter(function(a){return a.tipo==='banco';}).map(function(a){var tot=a.cartoes.reduce(function(s,c){return s+(c.fatura||0);},0);
return '<section class="app" style="--c:'+cor(a)+'">'+cabeca(a,tot)+(a.cartoes.length?a.cartoes.map(function(c){return cartaoHTML(a,c);}).join(''):'<p class="vazio">Nenhum cartão cadastrado.</p>')+'<button class="add" data-act="add-cartao" data-app="'+a.id+'">Adicionar cartão</button></section>';}).join('')+
'<button class="add" data-act="add-app" data-tipo="banco">Adicionar outro banco</button>';}

function contaHTML(a,b){var n=diasAte(parseISO(b.vence)),cls=n<0?'atrasada':n<=3?'perto':'';
return '<li class="item '+cls+'"><div class="info" role="button" tabindex="0" data-act="edit-conta" data-app="'+a.id+'" data-id="'+b.id+'"><div class="t">'+esc(b.desc||'Conta')+'</div><div class="s">Vencimento '+parseISO(b.vence).toLocaleDateString('pt-BR')+', '+quando(n)+'</div></div><div class="v num">'+brl(b.valor)+'</div><button data-act="pagar-conta" data-app="'+a.id+'" data-id="'+b.id+'">Paguei</button></li>';}
function pagaHTML(a,b){return '<li class="item"><div class="info"><div class="t">'+esc(b.desc||'Conta')+'</div><div class="s">paga em '+new Date(b.pagaEm||Date.now()).toLocaleDateString('pt-BR')+'</div></div><div class="v num">'+brl(b.valor)+'</div><button data-act="desfazer-conta" data-app="'+a.id+'" data-id="'+b.id+'">Desfazer</button></li>';}

function vContas(){return S.apps.filter(function(a){return a.tipo==='conta';}).map(function(a){
var pend=a.contas.filter(function(b){return !b.paga;}).sort(function(x,y){return x.vence<y.vence?-1:1;});
var pagas=a.contas.filter(function(b){return b.paga;}).sort(function(x,y){return (y.pagaEm||0)-(x.pagaEm||0);}).slice(0,3);
var tot=pend.reduce(function(s,b){return s+(b.valor||0);},0);
return '<section class="app" style="--c:'+cor(a)+'">'+cabeca(a,tot)+(pend.length?'<ul class="list">'+pend.map(function(b){return contaHTML(a,b);}).join('')+'</ul>':'<p class="vazio">Nenhuma conta em aberto.</p>')+
(pagas.length?'<details class="pagas"><summary>Pagas recentemente</summary><ul class="list">'+pagas.map(function(b){return pagaHTML(a,b);}).join('')+'</ul></details>':'')+
'<button class="add" data-act="add-conta" data-app="'+a.id+'">Adicionar conta</button></section>';}).join('')+
'<button class="add" data-act="add-app" data-tipo="conta">Adicionar outra empresa</button>';}

function vAtual(){var tem=V&&V.anterior,g=ghCfg();
var ghPanel='<section class="panel"><h2>Publicar no GitHub</h2><p>'+(g?'Conectado a <b>'+esc(g.user)+'/'+esc(g.repo)+'</b>. As atualizações vão para o GitHub e valem para todos os aparelhos.':'Conecte seu repositório para que as atualizações valham para todos os aparelhos. Sem isso, elas ficam só neste tablet.')+' O token fica salvo só neste aparelho.</p>'+
'<label>Usuário do GitHub<input id="gh-user" autocapitalize="off" value="'+esc(g?g.user:'tamakishio')+'"></label>'+
'<label>Repositório<input id="gh-repo" autocapitalize="off" value="'+esc(g?g.repo:'minhas-contas')+'"></label>'+
'<label>Token<input id="gh-token" type="password" autocomplete="off" placeholder="'+(g?'Salvo. Cole outro para trocar':'github_pat_…')+'" value="'+(g?esc(g.token):'')+'"></label>'+
'<div class="row"><button class="primary" data-act="gh-salvar">'+(g?'Salvar alterações':'Conectar')+'</button>'+(g?'<button class="danger" data-act="gh-sair">Desconectar</button>':'')+'</div></section>';
return ghPanel+'<section class="panel"><h2>Atualizar o código</h2><p>Cole aqui o código HTML completo da nova versão e toque em <b>Aplicar código</b>. Seus bancos, cartões e contas continuam salvos.</p><textarea id="codigo" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="Cole o código aqui (começa com &lt;!doctype html&gt;)"></textarea><div class="row"><button class="primary" data-act="aplicar">Aplicar código</button><button data-act="copiar">Copiar código atual</button></div></section>'+
'<section class="panel"><h2>Voltar à versão anterior</h2><p>'+(tem?'A versão anterior está guardada desde '+new Date(V.quando).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})+'. Voltar troca as duas de lugar, então dá para desfazer. Se um código novo deixar a página em branco, abra o endereço com #original no final para usar a versão de fábrica.':'Ainda não há versão anterior. Ela é guardada sozinha na primeira vez que você aplicar um código.')+'</p><button data-act="voltar"'+(tem?'':' disabled')+'>Voltar à versão anterior</button></section>'+
'<section class="panel"><h2>Backup dos dados</h2><p>Copie seus dados para guardar onde quiser, ou cole um backup aqui para restaurar.</p><textarea id="backup" spellcheck="false" autocapitalize="off" placeholder="Cole um backup aqui para restaurar"></textarea><div class="row"><button data-act="backup-copiar">Copiar backup</button><button data-act="backup-restaurar">Restaurar backup</button></div></section>';}

function render(){var v=$('#view');if(!v)return;var keep={};['codigo','backup'].forEach(function(id){var el=document.getElementById(id);if(el)keep[id]=el.value;});
v.innerHTML=tab==='inicio'?vInicio():tab==='bancos'?vBancos():tab==='contas'?vContas():vAtual();
Object.keys(keep).forEach(function(id){var el=document.getElementById(id);if(el)el.value=keep[id];});
document.querySelectorAll('.tabs button').forEach(function(b){if(b.dataset.tab===tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});}

function setSync(){var s=$('#sync');if(s)s.textContent={ok:'Salvo na sua conta',local:'Salvo neste aparelho',erro:'Sem conexão: salvo neste aparelho'}[nuvem];}
var tt;function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('on');},3400);}

function salvar(){try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}clearTimeout(timer);timer=setTimeout(salvarAgora,800);render();}
function salvarAgora(){clearTimeout(timer);fila=fila.then(function(){if(!(db&&uid)){setSync();return;}return db.doc(pathE()).set({json:JSON.stringify(S),em:Date.now()}).then(function(){nuvem='ok';},function(){nuvem='erro';}).then(setSync);});return fila;}
function salvarVersoes(v){V=v;localStorage.setItem(LSV,JSON.stringify(v));}
function comPrazo(p,ms){return Promise.race([p,new Promise(function(_,r){setTimeout(function(){r(new Error('timeout'));},ms);})]);}

function abrirModal(html){var m=$('#modal');m.innerHTML='<div class="sheet" role="dialog" aria-modal="true">'+html+'</div>';m.hidden=false;var f=m.querySelector('input');if(f)f.focus();}
function fecharModal(){var m=$('#modal');m.hidden=true;m.innerHTML='';}
function botoes(delAttrs){return '<div class="row">'+(delAttrs?'<button type="button" class="danger" '+delAttrs+'>Remover</button>':'')+'<span class="sp"></span><button type="button" data-act="fechar">Cancelar</button><button class="primary">Salvar</button></div>';}

function formApp(a,tipo){var x=a||{nome:'',tipo:tipo||'banco',cor:tipo==='conta'?'#0E9BD1':'#3B6FD9'};
abrirModal('<form data-form="app" data-id="'+(a?a.id:'')+'"><h3>'+(a?'Editar '+esc(a.nome):'Adicionar aplicativo')+'</h3>'+
'<label>Nome<input name="nome" required value="'+esc(x.nome)+'" placeholder="Ex.: Inter, Sabesp, Vivo"></label>'+
'<label>Tipo<select name="tipo"><option value="banco"'+(x.tipo==='banco'?' selected':'')+'>Banco ou cartão de crédito</option><option value="conta"'+(x.tipo==='conta'?' selected':'')+'>Conta da casa (luz, gás, internet…)</option></select></label>'+
'<label>Cor<input type="color" name="cor" value="'+cor(x)+'"></label>'+botoes(a?'data-act="del-app" data-id="'+a.id+'"':'')+'</form>');}
function formCartao(a,c){c=c||{};
abrirModal('<form data-form="cartao" data-app="'+a.id+'" data-id="'+(c.id||'')+'"><h3>'+(c.id?'Editar cartão':'Novo cartão')+' do '+esc(a.nome)+'</h3>'+
'<label>Nome do cartão<input name="nome" required value="'+esc(c.nome||'')+'" placeholder="Ex.: Platinum, Roxinho"></label>'+
'<label>Valor da fatura atual<input name="fatura" inputmode="decimal" value="'+moneyInput(c.fatura)+'" placeholder="0,00"></label>'+
'<div class="duo"><label>Dia do fechamento<input name="fecha" type="number" inputmode="numeric" min="1" max="31" required value="'+(c.fecha||'')+'"></label><label>Dia do vencimento<input name="vence" type="number" inputmode="numeric" min="1" max="31" required value="'+(c.vence||'')+'"></label></div>'+
'<p class="dica">O melhor dia de compra é calculado sozinho: é o dia seguinte ao fechamento.</p>'+botoes(c.id?'data-act="del-cartao" data-app="'+a.id+'" data-id="'+c.id+'"':'')+'</form>');}
function formConta(a,b){b=b||{};
abrirModal('<form data-form="conta" data-app="'+a.id+'" data-id="'+(b.id||'')+'"><h3>'+(b.id?'Editar conta':'Nova conta')+' da '+esc(a.nome)+'</h3>'+
'<label>Descrição<input name="desc" value="'+esc(b.desc||'')+'" placeholder="Ex.: Conta de novembro"></label>'+
'<label>Valor<input name="valor" inputmode="decimal" required value="'+moneyInput(b.valor)+'" placeholder="0,00"></label>'+
'<label>Vencimento<input name="vence" type="date" required value="'+(b.vence||isoHoje(7))+'"></label>'+botoes(b.id?'data-act="del-conta" data-app="'+a.id+'" data-id="'+b.id+'"':'')+'</form>');}

function acharCartao(a,id){return a.cartoes.filter(function(c){return c.id===id;})[0];}
function acharConta(a,id){return a.contas.filter(function(c){return c.id===id;})[0];}

document.addEventListener('submit',function(e){var f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();var fd=new FormData(f),d={};fd.forEach(function(v,k){d[k]=v;});var k=f.dataset.form,a;
if(k==='app'){var nome=String(d.nome||'').trim();if(!nome)return;a=appById(f.dataset.id);if(!a){a={id:novoId(),cartoes:[],contas:[]};S.apps.push(a);}a.nome=nome;a.tipo=d.tipo==='conta'?'conta':'banco';a.cor=d.cor;tab=a.tipo==='banco'?'bancos':'contas';}
if(k==='cartao'){a=appById(f.dataset.app);var c=acharCartao(a,f.dataset.id);if(!c){c={id:novoId()};a.cartoes.push(c);}c.nome=String(d.nome||'').trim()||'Cartão';c.fatura=parseMoney(d.fatura);c.fecha=clampDia(d.fecha);c.vence=clampDia(d.vence);}
if(k==='lemb'){var l={id:novoId(),texto:String(d.texto||'').trim()||'Atualizar minhas contas',data:d.data||isoHoje(1),hora:d.hora||'09:00',feito:false};S.lembretes.push(l);fecharModal();salvar();
abrirModal('<h3>Lembrete criado</h3><p class="dica" style="margin:0 0 14px">Para o tablet avisar mesmo com o app fechado, coloque o lembrete na sua agenda.</p><div class="row"><span class="sp"></span><button type="button" data-act="fechar">Agora não</button><a class="btn primary" href="'+linkAgenda(l)+'" target="_blank" rel="noopener" data-act="fechar">Colocar na agenda</a></div>');return;}
if(k==='conta'){a=appById(f.dataset.app);var b=acharConta(a,f.dataset.id);if(!b){b={id:novoId(),paga:false};a.contas.push(b);}b.desc=String(d.desc||'').trim();b.valor=parseMoney(d.valor);b.vence=d.vence||isoHoje(0);}
fecharModal();salvar();});

function copiarTexto(txt,ta){function manual(){if(ta){ta.value=txt;ta.focus();ta.select();}toast('O texto está na caixa: toque e segure para copiar.');}
try{navigator.clipboard.writeText(txt).then(function(){toast('Copiado.');},manual);}catch(e){manual();}}

function codigoAtual(){var o=null;try{o=localStorage.getItem(LSO);}catch(e){}return o;}
function trocarCodigo(novo,anterior){try{localStorage.setItem(LS,JSON.stringify(S));salvarVersoes({anterior:anterior,quando:Date.now()});if(novo)localStorage.setItem(LSO,novo);else localStorage.removeItem(LSO);}catch(e){toast('Não deu para guardar o código: o armazenamento está cheio.');return;}
if(location.hash==='#original')history.replaceState(null,'',location.pathname+location.search);location.reload();}
var LSG='minhascontas.github.v1';
function ghCfg(){try{var g=JSON.parse(localStorage.getItem(LSG)||'null');return g&&g.user&&g.repo&&g.token?g:null;}catch(e){return null;}}
function ghUrl(g){return 'https://api.github.com/repos/'+encodeURIComponent(g.user)+'/'+encodeURIComponent(g.repo)+'/contents/index.html';}
function b64enc(t){return btoa(unescape(encodeURIComponent(t)));}
function b64dec(t){return decodeURIComponent(escape(atob(String(t).replace(/\s/g,''))));}
function ghPublicar(code,msg){var g=ghCfg();var h={'Authorization':'Bearer '+g.token,'Accept':'application/vnd.github+json'};
return fetch(ghUrl(g)+'?t='+Date.now(),{headers:h,cache:'no-store'}).then(function(r){
if(!r.ok)throw new Error(r.status===404?'Não achei o index.html nesse repositório. Confira usuário e repositório.':r.status===401?'O GitHub não aceitou o token.':'O GitHub respondeu com erro '+r.status+'.');return r.json();}).then(function(atual){
var antigo=b64dec(atual.content);
return fetch(ghUrl(g),{method:'PUT',headers:h,body:JSON.stringify({message:msg,content:b64enc(code),sha:atual.sha})}).then(function(p){
if(!p.ok)throw new Error(p.status===401||p.status===403||p.status===404?'O token não tem permissão para alterar esse repositório.':'O GitHub respondeu com erro '+p.status+'.');return antigo;});});}
function avisoPublicado(){abrirModal('<h3>Publicado no GitHub</h3><p class="dica" style="margin:0 0 14px">A atualização vale para todos os aparelhos. O GitHub leva de 1 a 10 minutos para mostrar a versão nova. Depois disso, feche e abra o app.</p><div class="row"><span class="sp"></span><button type="button" data-act="fechar">Ok</button><button type="button" class="primary" data-act="recarregar">Recarregar agora</button></div>');}
function aplicar(){var code=($('#codigo').value||'').trim();
if(!/^<!doctype html/i.test(code)){toast('O código precisa começar com <!doctype html>.');return;}
if(ghCfg()){if(!confirm('Publicar este código no GitHub? A atualização vai valer para todos os aparelhos.'))return;
toast('Enviando para o GitHub…');
ghPublicar(code,'Atualização pelo app Minhas contas').then(function(antigo){salvarVersoes({anterior:antigo,quando:Date.now(),gh:true});try{localStorage.removeItem(LSO);}catch(e){}$('#codigo').value='';render();avisoPublicado();}).catch(function(e){toast(e.message||'Não deu para enviar. Confira a internet.');});return;}
if(!confirm('Aplicar este código só neste aparelho? A página vai recarregar com a nova versão.'))return;
trocarCodigo(code,codigoAtual()||'__ORIGINAL__');}
function voltar(){if(!V||!V.anterior)return;
if(V.gh){if(!ghCfg()){toast('Conecte o GitHub de novo para voltar a versão.');return;}
if(!confirm('Voltar à versão anterior no GitHub? Vale para todos os aparelhos.'))return;
toast('Enviando para o GitHub…');
ghPublicar(V.anterior,'Voltar à versão anterior').then(function(antigo){salvarVersoes({anterior:antigo,quando:Date.now(),gh:true});render();avisoPublicado();}).catch(function(e){toast(e.message||'Não deu para enviar. Confira a internet.');});return;}
if(!confirm('Voltar à versão anterior? A página vai recarregar.'))return;
var prev=V.anterior==='__ORIGINAL__'?null:V.anterior;trocarCodigo(prev,codigoAtual()||'__ORIGINAL__');}

document.addEventListener('click',function(e){var m=$('#modal');if(e.target===m){fecharModal();return;}
var b=e.target.closest('[data-act],[data-tab]');if(!b)return;
if(b.dataset.tab){tab=b.dataset.tab;render();window.scrollTo(0,0);return;}
var act=b.dataset.act,a=appById(b.dataset.app),it;
switch(act){
case 'fechar':setTimeout(fecharModal,0);break;
case 'add-app':formApp(null,b.dataset.tipo);break;
case 'edit-app':formApp(appById(b.dataset.id));break;
case 'del-app':a=appById(b.dataset.id);if(a&&confirm('Remover '+a.nome+' e tudo que está nele?')){S.apps=S.apps.filter(function(x){return x!==a;});fecharModal();salvar();}break;
case 'add-cartao':formCartao(a);break;
case 'edit-cartao':formCartao(a,acharCartao(a,b.dataset.id));break;
case 'del-cartao':it=acharCartao(a,b.dataset.id);if(it&&confirm('Remover o cartão '+it.nome+'?')){a.cartoes=a.cartoes.filter(function(x){return x!==it;});fecharModal();salvar();}break;
case 'pagar-fatura':it=acharCartao(a,b.dataset.id);if(it&&confirm('Marcar a fatura do '+it.nome+' como paga? O valor volta para zero.')){it.fatura=0;salvar();toast('Fatura marcada como paga.');}break;
case 'add-conta':formConta(a);break;
case 'edit-conta':formConta(a,acharConta(a,b.dataset.id));break;
case 'del-conta':it=acharConta(a,b.dataset.id);if(it&&confirm('Remover esta conta?')){a.contas=a.contas.filter(function(x){return x!==it;});fecharModal();salvar();}break;
case 'pagar-conta':it=acharConta(a,b.dataset.id);if(it){it.paga=true;it.pagaEm=Date.now();var pg=a.contas.filter(function(x){return x.paga;}).sort(function(x,y){return (y.pagaEm||0)-(x.pagaEm||0);});if(pg.length>12){var fora=pg.slice(12);a.contas=a.contas.filter(function(x){return fora.indexOf(x)<0;});}salvar();toast('Conta marcada como paga.');}break;
case 'desfazer-conta':it=acharConta(a,b.dataset.id);if(it){it.paga=false;delete it.pagaEm;salvar();}break;
case 'add-lemb':formLembrete();break;
case 'lemb-feito':S.lembretes.forEach(function(l){if(l.id===b.dataset.id)l.feito=true;});S.lembretes=S.lembretes.filter(function(l){return !l.feito||quandoLemb(l)>Date.now()-30*86400000;});salvar();toast('Lembrete concluído.');break;
case 'del-lemb':S.lembretes=S.lembretes.filter(function(l){return l.id!==b.dataset.id;});salvar();break;
case 'recarregar':location.reload();break;
case 'gh-salvar':var gu=$('#gh-user').value.trim(),gr=$('#gh-repo').value.trim(),gt=$('#gh-token').value.trim();if(!gu||!gr||!gt){toast('Preencha usuário, repositório e token.');break;}try{localStorage.setItem(LSG,JSON.stringify({user:gu,repo:gr,token:gt}));}catch(e){}render();toast('GitHub conectado.');break;
case 'gh-sair':if(confirm('Desconectar o GitHub deste aparelho?')){try{localStorage.removeItem(LSG);}catch(e){}render();}break;
case 'aplicar':aplicar();break;
case 'copiar':copiarTexto(codigoAtual()||fonteAtual(),$('#codigo'));break;
case 'voltar':voltar();break;
case 'backup-copiar':copiarTexto(JSON.stringify(S),$('#backup'));break;
case 'backup-restaurar':var j=null;try{j=JSON.parse($('#backup').value);}catch(err){}if(!valido(j)){toast('Esse texto não é um backup válido.');break;}if(confirm('Trocar seus dados atuais por este backup?')){S=normalizar(j);$('#backup').value='';salvar();toast('Backup restaurado.');}break;
}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('#modal').hidden)fecharModal();if(e.key==='Enter'&&e.target.getAttribute&&e.target.getAttribute('role')==='button')e.target.click();});

try{S=JSON.parse(localStorage.getItem(LS));}catch(e){}
if(!valido(S))S=padrao();normalizar(S);
try{V=JSON.parse(localStorage.getItem(LSV)||'null');}catch(e){}
render();setSync();

setInterval(function(){if(tab==='inicio'&&$('#modal').hidden)render();},60000);
document.addEventListener('visibilitychange',function(){if(!document.hidden&&tab==='inicio'&&$('#modal').hidden)render();});
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(function(){});}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}

})();
</script>
</body>
